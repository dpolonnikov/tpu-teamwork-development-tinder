databaseChangeLog:
  - changeSet:
      id: create-image
      author: Dmitry Polonnikov
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: images
      changes:
        - createTable:
            tableName: images
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: file_key
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: original_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: mime_type
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  constraints:
                    nullable: false
