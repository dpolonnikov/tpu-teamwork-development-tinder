databaseChangeLog:
  - changeSet:
      id: 25032026-create-message-table
      author: bairov_erdem
      changes:
        - createTable:
            tableName: messages
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: from_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: to_user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: from_user_id
            constraintName: fk_messages_from_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: messages
            baseColumnNames: to_user_id
            constraintName: fk_messages_to_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE