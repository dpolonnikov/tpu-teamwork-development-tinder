databaseChangeLog:
  - changeSet:
      id: create-dormitory
      author: Dmitry Polonnikov
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: dormitories
      changes:
        - createTable:
            tableName: dormitories
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: number
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  constraints:
                    nullable: false
